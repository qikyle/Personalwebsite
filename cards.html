<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css?family=Roboto+Slab:100,300,400,700" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css?family=Raleway:300,300i,400,400i,500,500i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet"/>
<style>
* {
  box-sizing: border-box;
}

body, html {
  font-family: 'Roboto Slab', serif;
  margin: 0;
  width: 100%;
  height: 100%;
  padding: 0;
}

body {
  background-color: #D2DBDD;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.cards {
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: stretch;
  max-width: 820px;
  padding: 40px 20px;
}

.card--1 .card__img,
.card--1 .card__img--hover {
  background-image: url('https://images.pexels.com/photos/45202/brownie-dessert-cake-sweet-45202.jpeg?auto=compress&cs=tinysrgb&h=750&w=1260');
}

.card--2 .card__img,
.card--2 .card__img--hover {
  background-image: url('https://images.pexels.com/photos/307008/pexels-photo-307008.jpeg?auto=compress&cs=tinysrgb&h=750&w=1260');
}

.card--3 .card__img,
.card--3 .card__img--hover {
  background-image: url('https://images.pexels.com/photos/1640777/pexels-photo-1640777.jpeg?auto=compress&cs=tinysrgb&h=750&w=1260');
}

.card__like {
  width: 18px;
}

.card__clock {
  width: 15px;
  vertical-align: middle;
  fill: #AD7D52;
}

.card__time {
  font-size: 12px;
  color: #AD7D52;
  vertical-align: middle;
  margin-left: 5px;
}

.card__clock-info {
  float: right;
}

.card__img {
  visibility: hidden;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  width: 100%;
  height: 235px;
  border-top-left-radius: 12px;
  border-top-right-radius: 12px;
}

.card__info-hover {
  position: absolute;
  padding: 16px;
  width: 100%;
  opacity: 0;
  top: 0;
  transition: opacity 0.25s ease-out;
}

.card__img--hover {
  transition: 0.25s all ease-out;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  width: 100%;
  position: absolute;
  height: 235px;
  border-top-left-radius: 12px;
  border-top-right-radius: 12px;
  top: 0;
}

/* ── CARD BASE ── */
.card {
  margin-right: 25px;
  /* smooth lift — no elastic overshoot */
  transition: transform 0.28s ease-out, box-shadow 0.28s ease-out;
  background-color: #fff;
  width: 33.3%;
  position: relative;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0px 13px 10px -7px rgba(0, 0, 0, 0.10);
  /* equal height: stretch children */
  display: flex;
  flex-direction: column;
}

.card:last-child {
  margin-right: 0;
}

/* ── HOVER: subtle lift instead of big scale pop ── */
.card:hover {
  box-shadow: 0px 20px 22px -8px rgba(0, 0, 0, 0.14);
  transform: translateY(-5px) scale(1.025);
}

/* ── CARD INFO — fills remaining height for equal cards ── */
.card__info {
  z-index: 2;
  background-color: #fff;
  border-bottom-left-radius: 12px;
  border-bottom-right-radius: 12px;
  padding: 16px 24px 24px 24px;
  flex: 1;
  transition: background-color 0.25s ease-out;
}

.card__category {
  font-family: 'Raleway', sans-serif;
  text-transform: uppercase;
  font-size: 13px;
  letter-spacing: 2px;
  font-weight: 500;
  color: #868686;
}

.card__title {
  margin-top: 5px;
  margin-bottom: 10px;
  font-family: 'Roboto Slab', serif;
  color: #333;
}

.card__by {
  font-size: 12px;
  font-family: 'Raleway', sans-serif;
  font-weight: 500;
  color: #555;
}

.card__author {
  font-weight: 600;
  text-decoration: none;
  color: #AD7D52;
}

.card:hover .card__img--hover {
  height: 100%;
  opacity: 0.3;
}

.card:hover .card__info {
  background-color: transparent;
  position: relative;
}

.card:hover .card__info-hover {
  opacity: 1;
}

/* ── MOBILE ── */
@media (max-width: 640px) {
  .cards {
    flex-direction: column;
    align-items: center;
    gap: 20px;
    padding: 24px 16px;
  }
  .card {
    width: 100%;
    max-width: 360px;
    margin-right: 0;
  }
}
</style>
</head>
<body>

<div class="cards">

  <div class="card card--1">
    <div class="card__img"></div>
    <div class="card__img--hover"></div>
    <div class="card__info-hover">
      <svg class="card__like" viewBox="0 0 24 24">
        <path fill="#fff" d="M12,21.35L10.55,20.03C5.4,15.36 2,12.27 2,8.5C2,5.41 4.42,3 7.5,3C9.24,3 10.91,3.81 12,5.08C13.09,3.81 14.76,3 16.5,3C19.58,3 22,5.41 22,8.5C22,12.27 18.6,15.36 13.45,20.03L12,21.35Z"/>
      </svg>
      <div class="card__clock-info">
        <svg class="card__clock" viewBox="0 0 24 24">
          <path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M16.2,16.2L11,13V7H12.5V12.2L17,14.9L16.2,16.2Z"/>
        </svg>
        <span class="card__time">5 min</span>
      </div>
    </div>
    <div class="card__info">
      <span class="card__category">Dessert</span>
      <h3 class="card__title">The best brownie recipe</h3>
      <span class="card__by">by <a class="card__author" href="#">Jane Doe</a></span>
    </div>
  </div>

  <div class="card card--2">
    <div class="card__img"></div>
    <div class="card__img--hover"></div>
    <div class="card__info-hover">
      <svg class="card__like" viewBox="0 0 24 24">
        <path fill="#fff" d="M12,21.35L10.55,20.03C5.4,15.36 2,12.27 2,8.5C2,5.41 4.42,3 7.5,3C9.24,3 10.91,3.81 12,5.08C13.09,3.81 14.76,3 16.5,3C19.58,3 22,5.41 22,8.5C22,12.27 18.6,15.36 13.45,20.03L12,21.35Z"/>
      </svg>
      <div class="card__clock-info">
        <svg class="card__clock" viewBox="0 0 24 24">
          <path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M16.2,16.2L11,13V7H12.5V12.2L17,14.9L16.2,16.2Z"/>
        </svg>
        <span class="card__time">8 min</span>
      </div>
    </div>
    <div class="card__info">
      <span class="card__category">Photography</span>
      <h3 class="card__title">Tips for golden hour photography</h3>
      <span class="card__by">by <a class="card__author" href="#">John Smith</a></span>
    </div>
  </div>

  <div class="card card--3">
    <div class="card__img"></div>
    <div class="card__img--hover"></div>
    <div class="card__info-hover">
      <svg class="card__like" viewBox="0 0 24 24">
        <path fill="#fff" d="M12,21.35L10.55,20.03C5.4,15.36 2,12.27 2,8.5C2,5.41 4.42,3 7.5,3C9.24,3 10.91,3.81 12,5.08C13.09,3.81 14.76,3 16.5,3C19.58,3 22,5.41 22,8.5C22,12.27 18.6,15.36 13.45,20.03L12,21.35Z"/>
      </svg>
      <div class="card__clock-info">
        <svg class="card__clock" viewBox="0 0 24 24">
          <path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M16.2,16.2L11,13V7H12.5V12.2L17,14.9L16.2,16.2Z"/>
        </svg>
        <span class="card__time">3 min</span>
      </div>
    </div>
    <div class="card__info">
      <span class="card__category">Food</span>
      <h3 class="card__title">Healthy salads for every season</h3>
      <span class="card__by">by <a class="card__author" href="#">Maria Lee</a></span>
    </div>
  </div>

</div>

</body>
</html>
